services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fgc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network

  mongo:
    image: mongo:7
    container_name: fgc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: fgc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - fgc_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 10

  fgc-users-api:
    build:
      context: ../fgc-users-api
      dockerfile: Dockerfile
    image: fgc-users-api:latest
    container_name: fgc-users-api
    ports:
      - "5038:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network

  fgc-catalog-api:
    build:
      context: ../fgc-catalog-api
      dockerfile: Dockerfile
    image: fgc-catalog-api:latest
    container_name: fgc-catalog-api
    ports:
      - "5070:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__MongoDb=mongodb://fgc-mongo:27017
      - MongoDb__DatabaseName=fgc_catalog
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Elasticsearch__Uri=http://fgc-elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fgc_network
    volumes:
      - catalog_data:/app/data

  fgc-payments-api:
    build:
      context: ../fgc-payments-api
      dockerfile: Dockerfile
    image: fgc-payments-api:latest
    container_name: fgc-payments-api
    ports:
      - "5050:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network
  redis:
    image: redis:7-alpine
    container_name: fgc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network
networks:
  fgc_network:
    driver: bridge

volumes:
  mongo_data:
  catalog_data:
  elastic_data: