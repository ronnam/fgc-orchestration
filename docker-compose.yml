services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fgc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network

  mongo:
    image: mongo:7
    container_name: fgc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fgc_network

  fgc-users-api:
    build:
      context: ../fgc-users-api
      dockerfile: Dockerfile
    image: fgc-users-api:latest
    container_name: fgc-users-api
    ports:
      - "5038:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network

  fgc-catalog-api:
    build:
      context: ../fgc-catalog-api
      dockerfile: Dockerfile
    image: fgc-catalog-api:latest
    container_name: fgc-catalog-api
    ports:
      - "5070:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__MongoDb=mongodb://fgc-mongo:27017
      - MongoDb__DatabaseName=fgc_catalog
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - fgc_network
    volumes:
      - catalog_data:/app/data

  fgc-payments-api:
    build:
      context: ../fgc-payments-api
      dockerfile: Dockerfile
    image: fgc-payments-api:latest
    container_name: fgc-payments-api
    ports:
      - "5050:8080"
    environment:
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fgc_network
networks:
  fgc_network:
    driver: bridge

volumes:
  mongo_data:
  catalog_data: