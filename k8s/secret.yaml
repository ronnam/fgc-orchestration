# Placeholder para desenvolvimento/avaliação do projeto acadêmico.
# Em um ambiente real, estes valores não seriam versionados em texto plano
# (usar kubectl create secret / um cofre de segredos externo).
apiVersion: v1
kind: Secret
metadata:
  name: fgc-users-api-secret
  namespace: fgc
  labels:
    app: fgc-users-api
type: Opaque
stringData:
  ConnectionStrings__UserDb: "Data Source=users.db"
  Jwt__Key: "FgcUsers-Auth-JWT-Key-2026-Strong-And-Secure"
---
