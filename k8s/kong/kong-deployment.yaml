apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-kong
  namespace: fgc
  labels:
    app: fgc-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgc-kong
  template:
    metadata:
      labels:
        app: fgc-kong
    spec:
      containers:
        - name: kong
          image: kong:3.5
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: kong-jwt-secret
                  key: JWT_KEY
          command:
            - /bin/sh
            - -c
            - |
              sed "s|__JWT_KEY__|${JWT_KEY}|g" /etc/kong-config/kong.template.yml > /etc/kong/kong.yml
              exec /docker-entrypoint.sh kong docker-start
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong-config
      volumes:
        - name: kong-config
          configMap:
            name: kong-config