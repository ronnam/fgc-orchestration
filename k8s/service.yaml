apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fgc
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: management
      port: 15672
      targetPort: 15672
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodeport
  namespace: fgc
  labels:
    app: rabbitmq
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 30672
      protocol: TCP
---
