apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fgc
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "admin"
            - name: RABBITMQ_DEFAULT_PASS
              value: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-users-api
  namespace: fgc
  labels:
    app: fgc-users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgc-users-api
  template:
    metadata:
      labels:
        app: fgc-users-api
    spec:
      containers:
        - name: fgc-users-api
          image: fgcacrronnam.azurecr.io/fgc-users-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fgc-users-api-config
            - secretRef:
                name: fgc-users-api-secret
          volumeMounts:
            - name: db
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: users-db-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-catalog-api
  namespace: fgc
  labels:
    app: fgc-catalog-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fgc-catalog-api
  template:
    metadata:
      labels:
        app: fgc-catalog-api
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://elasticsearch:9200/_cluster/health; do
                echo "aguardando elasticsearch..."; sleep 5;
              done
      containers:
        - name: fgc-catalog-api
          image: fgcacrronnam.azurecr.io/fgc-catalog-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fgc-catalog-api-config
            - secretRef:
                name: fgc-catalog-api-secret
          volumeMounts:
            - name: catalog-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: catalog-sqlite-pvc
---
