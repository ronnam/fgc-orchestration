apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fgc
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "admin"
            - name: RABBITMQ_DEFAULT_PASS
              value: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-users-api
  namespace: fgc
  labels:
    app: fgc-users-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgc-users-api
  template:
    metadata:
      labels:
        app: fgc-users-api
    spec:
      containers:
        - name: fgc-users-api
          image: fgc-users-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fgc-users-api-config
            - secretRef:
                name: fgc-users-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
