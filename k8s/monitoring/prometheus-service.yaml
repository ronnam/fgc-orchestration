---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fgc
  labels:
    app: prometheus
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: fgc
  labels:
    app: prometheus
    component: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
      protocol: TCP