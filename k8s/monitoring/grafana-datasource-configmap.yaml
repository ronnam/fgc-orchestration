apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: fgc
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus.fgc.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s
          httpMethod: POST