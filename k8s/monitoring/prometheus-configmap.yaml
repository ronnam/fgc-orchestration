---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fgc
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: fgc-aks

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'fgc-microservices'
        metrics_path: /metrics
        scrape_timeout: 10s
        static_configs:
          - targets: ['fgc-users-api.fgc.svc.cluster.local:80']
            labels:
              service: 'users-api'
          - targets: ['fgc-catalog-api.fgc.svc.cluster.local:80']
            labels:
              service: 'catalog-api'

  alerts.yml: |
    groups:
      - name: fgc-alerts
        rules:
          - alert: ServiceDown
            expr: up{job="fgc-microservices"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Serviço {{ $labels.service }} fora do ar"
              description: "O Prometheus não consegue raspar {{ $labels.instance }} há mais de 1 minuto."

          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_received_total{job="fgc-microservices",code=~"5.."}[5m]))
                /
                sum(rate(http_requests_received_total{job="fgc-microservices"}[5m]))
              ) * 100 > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Taxa de erros 5xx acima de 5%"
              description: "A taxa de erros 5xx está em {{ $value | printf \"%.2f\" }}% há 5 minutos."

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_request_duration_seconds_bucket{job="fgc-microservices"}[5m]))
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latência p95 acima de 1 segundo"
              description: "O p95 de latência está em {{ $value | printf \"%.3f\" }}s há 5 minutos."